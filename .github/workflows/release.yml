name: Release

# Push a tag such as v1.0.0 to build the app and open a draft release with the DMG.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    name: Build and draft release
    runs-on: xcode-27
    timeout-minutes: 45
    env:
      # Optional. Add these repository secrets to sign with Developer ID and notarize.
      DEVELOPER_ID_P12_BASE64: ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
      DEVELOPER_ID_P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
      NOTARY_KEY_BASE64: ${{ secrets.NOTARY_KEY_BASE64 }}
      NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
      NOTARY_ISSUER: ${{ secrets.NOTARY_ISSUER }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Select Xcode 27.1
        run: sudo xcode-select -s /Applications/Xcode_27.1.app

      - name: Import Developer ID certificate
        if: env.DEVELOPER_ID_P12_BASE64 != ''
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          echo "$DEVELOPER_ID_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/developer-id.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/developer-id.p12" -k "$KEYCHAIN" -P "$DEVELOPER_ID_P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db
          IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN" | grep -Eo '"Developer ID Application: [^"]+"' | head -1 | tr -d '"')
          echo "SIGN_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"

      - name: Prepare notarization key
        if: env.NOTARY_KEY_BASE64 != ''
        run: |
          echo "$NOTARY_KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/notary-key.p8"
          echo "NOTARY_KEY_PATH=$RUNNER_TEMP/notary-key.p8" >> "$GITHUB_ENV"

      - name: Build app, zip, and disk image
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          # Without a Developer ID certificate, ship an ad-hoc build.
          export SIGN_IDENTITY="${SIGN_IDENTITY:--}"
          scripts/build.sh

      - name: Smoke test
        run: |
          MMC="build/Mac Memory Cleaner.app/Contents/MacOS/MacMemoryCleaner"
          "$MMC" --help > /dev/null
          "$MMC" --stats
          hdiutil verify build/MacMemoryCleaner.dmg

      - name: Write checksums and release notes
        run: |
          (cd build && shasum -a 256 MacMemoryCleaner.dmg MacMemoryCleaner.zip > SHA256SUMS.txt)
          VERSION="${GITHUB_REF_NAME#v}"
          # The CHANGELOG section for this version, without its heading.
          awk -v version="$VERSION" '
            $0 ~ "^## \\[" version "\\]" { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > build/release-notes.md
          if [[ ! -s build/release-notes.md ]]; then
            echo "::error::CHANGELOG.md has no section for $VERSION"
            exit 1
          fi

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            build/MacMemoryCleaner.dmg build/MacMemoryCleaner.zip build/SHA256SUMS.txt \
            --title "Mac Memory Cleaner ${GITHUB_REF_NAME#v}" \
            --notes-file build/release-notes.md \
            --draft --verify-tag

      - name: Remove signing keychain
        if: always() && env.DEVELOPER_ID_P12_BASE64 != ''
        run: security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true
